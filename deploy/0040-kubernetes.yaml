apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-debug-service
  namespace: pod-debug
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-debug-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-debug-service
    spec:
      serviceAccountName: pod-debug-service
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: lingxi.image.io/KunPeng/pod-debug/pod-debug-service:v0.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pod-debug-service
            - secretRef:
                name: pod-debug-service-callers
          env:
            - name: PODDEBUG_OWNER_INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: pod-debug-service
  namespace: pod-debug
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pod-debug-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
