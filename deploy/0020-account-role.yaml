apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-debug-service
  namespace: pod-debug
automountServiceAccountToken: true
---
# The service and diagnostic Pods share the pod-debug namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-debug-service
  namespace: pod-debug
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-debug-service
  namespace: pod-debug
subjects:
  - kind: ServiceAccount
    name: pod-debug-service
    namespace: pod-debug
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-debug-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-debug-service-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-debug-service-node-reader
subjects:
  - kind: ServiceAccount
    name: pod-debug-service
    namespace: pod-debug
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-debug-service-node-reader
